apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
if (new File("$projectDir/google-services.json").exists()) {
  apply plugin: 'com.google.gms.google-services'
  apply plugin: 'com.google.firebase.crashlytics'
}
apply plugin: 'io.sentry.android.gradle'
apply plugin: 'jacoco'

android {
  namespace "com.meter.giga"
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    applicationId "com.meter.giga"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode project.VERSION_CODE.toInteger()
    versionName project.VERSION_NAME
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    aaptOptions {
      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
  }
  kotlinOptions {
    jvmTarget = '21'
  }
  signingConfigs {
    release {
      storeFile file(KEYSTORE_PATH)
      storePassword KEYSTORE_PASSWORD
      keyAlias KEY_ALIAS
      keyPassword KEY_PASSWORD
    }
  }
  buildTypes {
    debug {
      testCoverageEnabled true
      debuggable true
      minifyEnabled false
      applicationIdSuffix ".debug"
      versionNameSuffix
    }
    release {
      ndk {
        debugSymbolLevel 'FULL'
      }
      debuggable false
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.release
    }
  }

  buildFeatures {
    buildConfig true
  }

  jacoco {
    version = "0.8.12"
  }

  testOptions {
    unitTests.includeAndroidResources = true
  }
}

sentry {
  tracingInstrumentation {
    enabled = false
  }
}

repositories {
  flatDir {
    dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
  }
}

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "com.squareup.okhttp3:logging-interceptor:4.9.0"
  implementation 'com.squareup.retrofit2:retrofit:2.9.0'
  implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
  implementation 'androidx.work:work-runtime-ktx:2.11.0'
  implementation 'com.google.android.play:app-update:2.1.0'
  implementation 'com.google.android.play:app-update-ktx:2.1.0'
  implementation 'com.google.android.material:material:1.13.0'
  implementation 'androidx.lifecycle:lifecycle-service:2.9.3'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
  implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
  implementation "androidx.security:security-crypto:1.1.0"
  implementation "androidx.datastore:datastore-preferences:1.1.7"
  implementation 'io.sentry:sentry-android:8.29.0'
  implementation "com.google.android.gms:play-services-location:21.3.0"
  implementation project(':capacitor-android')
  implementation project(':ndt7lib')
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3"
  testImplementation "junit:junit:$junitVersion"
  androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
  androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
  testImplementation "org.robolectric:robolectric:4.12.1"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
  testImplementation "androidx.work:work-testing:2.11.1"
  implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))

  constraints {
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
      because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
    }
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
      because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
    }
  }

  testImplementation 'org.mockito:mockito-core:5.14.1'
  testImplementation "io.mockk:mockk:1.13.10"
  testImplementation("androidx.test:core:1.7.0")
  testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
  testImplementation "org.jetbrains.kotlin:kotlin-reflect"
  testImplementation "com.squareup.okhttp3:okhttp:4.12.0"
  androidTestImplementation 'com.linkedin.dexmaker:dexmaker-mockito:2.28.3'
  androidTestImplementation 'androidx.test.espresso:espresso-web:3.7.0'
  androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test:rules:1.7.0'
  androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
  implementation project(':capacitor-cordova-android-plugins')
  implementation "org.jetbrains.kotlin:kotlin-test:2.1.21"
}

apply from: 'capacitor.build.gradle'
apply plugin: 'org.jetbrains.kotlin.android'

try {
  def servicesJSON = file('google-services.json')
  if (servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
  }
} catch (Exception e) {
  logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('jacocoTestReport', JacocoReport) {
  group = "Reporting"
  description = "Generate Jacoco code coverage report for the debug build."

  dependsOn("testDebugUnitTest")

  reports {
    xml.required = true
    html.required = true
  }

  def sourceDirs = [
    "src/main/java",
    "src/main/kotlin"
  ]
  sourceDirectories.setFrom(files(sourceDirs))

  def classDirs = fileTree(
    dir: "${buildDir}/tmp/kotlin-classes/debug",
    excludes: [
      '**/R.class',
      '**/R$*.class',
      '**/BuildConfig.*',
      '**/Manifest*.*',
      '**/*Test*.*',
      'android/**/*.*',
    ]
  )
  classDirectories.setFrom(files([classDirs]))

  executionData.setFrom(files("${buildDir}/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"))
}

tasks.withType(Test).configureEach {
  jacoco.includeNoLocationClasses = true
  jacoco.excludes = ['jdk.internal.*']
}

tasks.register("incrementVersion") {
  doLast {
    def propsFile = rootProject.file("gradle.properties")
    def props = new Properties()
    props.load(new FileInputStream(propsFile))

    def versionCode = props["VERSION_CODE"].toInteger() + 1
    def versionName = props["VERSION_NAME"]

    def parts = versionName.tokenize('.')
    parts[2] = (parts[2].toInteger() + 1).toString()
    versionName = parts.join('.')

    props["VERSION_CODE"] = versionCode.toString()
    props["VERSION_NAME"] = versionName

    props.store(new FileOutputStream(propsFile), null)

    println "Updated to versionCode=$versionCode, versionName=$versionName"
  }
}
